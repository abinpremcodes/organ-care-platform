<!DOCTYPE html>
<html>
<head>
    <title> OrganCare Platform</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        
.custom-card {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 15px;
    transition: all 0.3s ease;
}

.custom-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

.outline-text {
    text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
}


        
        /* body {
        opacity: 0;
        animation: fadeIn 1.2s ease-in forwards;
             }

        @keyframes fadeIn {
        from {
        opacity: 0;
        }
         to {
        opacity: 1;
        }
        } */

        body {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlide 1s ease-out forwards;
}

@keyframes fadeSlide {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}



        .page-title {
          color: #b30000;
          font-weight: bold;
          text-align: center;
          text-shadow: 
          1px 1px 0 white,
         -1px -1px 0 white,
          1px -1px 0 white,
         -1px 1px 0 white;
        }



        body {
            margin: 0;
            min-height: 100vh;
            background: url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=1950&q=80") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
        }

        /* Soft dark overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        .navbar {
            background-color: #b30000;
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Main content glass container
        .main-container {
            background:
        linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
        url("https://www.transparenttextures.com/patterns/cubes.png");
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }
         */

        .card {
            border-radius: 12px;
            border: none;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .btn-primary {
            background-color: #b30000;
            border: none;
        }

        .btn-primary:hover {
            background-color: #800000;
        }

        .btn-success {
            background-color: #cc0000;
            border: none;
        }

        .btn-success:hover {
            background-color: #990000;
        }

        .page-title {
            color: #b30000;
            font-weight: bold;
        }

        /* Responsive spacing */
        @media (max-width: 768px) {
            .main-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
           OrganCare Platform
        </a>


        <div>
            <a href="{% url 'donor_list' %}" class="btn btn-light btn-sm me-2">Donors</a>
            <a href="{% url 'recipient_list' %}" class="btn btn-light btn-sm me-2">Recipients</a>
            <a href="{% url 'hospital_list' %}" class="btn btn-light btn-sm">Hospitals</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="main-container">
        {% block content %}
        {% endblock %}
    </div>
</div>

</body>
</html>
