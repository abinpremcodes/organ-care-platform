<!DOCTYPE html>
<html>
<head>
    <title>Organ Sharing System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: url("https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1950&q=80") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.65);
            padding: 60px;
            border-radius: 15px;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        p {
            font-size: 18px;
            margin-top: 20px;
            opacity: 0.85;
        }

        .enter-text {
            margin-top: 30px;
            font-size: 16px;
            animation: blink 1.5s infinite;
            cursor: pointer;
        }

        @keyframes blink {
            0% {opacity: 1;}
            50% {opacity: 0.3;}
            100% {opacity: 1;}
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="overlay">
    <h1 class="display-3 fw-bold text-white">
     OrganCare Platform
    </h1>

    <p>Connecting Donors, Recipients & Hospitals Efficiently</p>

    <div class="enter-text" onclick="goToSite()">
        Press Enter to Continue
    </div>
</div>

<script>
    function goToSite() {
        window.location.href = "/donors/";
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            goToSite();
        }
    });
</script>

</body>
</html>
