{% extends 'base.html' %}

{% block content %}

<div class="card shadow p-4">
    <h3 class="mb-3">
        {% if form.instance.pk %}
            Update Recipient
        {% else %}
            Add Recipient
        {% endif %}
    </h3>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-2">Save</button>
        <a href="{% url 'recipient_list' %}" class="btn btn-secondary mt-2">Back</a>
    </form>
</div>

{% endblock %}
